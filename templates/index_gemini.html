<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Mask Monitoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tùy chỉnh thanh cuộn cho đẹp mắt */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="flex items-center gap-3 mb-8">
            <div class="bg-indigo-600 p-2.5 rounded-lg shadow-lg shadow-indigo-200">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            </div>
            <div>
                <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-700 to-blue-500">
                    AI Mask Detection
                </h1>
                <p class="text-slate-500 text-sm mt-1">Real-time ESP32 Camera Monitoring System</p>
            </div>
        </div>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Cột Camera -->
            <div class="lg:col-span-2 bg-white rounded-2xl shadow-xl shadow-slate-200/50 p-5 border border-slate-100">
                <div class="flex justify-between items-center mb-5">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        Live Camera Feed
                    </h2>
                    <!-- Badge LIVE (ẩn mặc định, sẽ hiện khi kết nối) -->
                    <div id="live-badge" class="hidden flex items-center gap-2 px-3 py-1 bg-rose-50 text-rose-600 rounded-full text-xs font-bold border border-rose-100">
                        <span class="relative flex h-2.5 w-2.5">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-rose-500"></span>
                        </span>
                        LIVE
                    </div>
                </div>
                
                <!-- Box nhập IP -->
                <div class="flex flex-col sm:flex-row gap-3 mb-5">
                    <div class="relative flex-1">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                        </div>
                        <input type="text" id="camera-ip" 
                               placeholder="Nhập IP ESP32 (VD: 192.168.1.15) hoặc 0 để test" 
                               class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                               value="192.168.1." />
                    </div>
                    <button onclick="connectCamera()" 
                            class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl font-semibold transition-all shadow-md shadow-indigo-200 active:scale-95 flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        Kết nối
                    </button>
                </div>

                <!-- Khung Video (Tỷ lệ 16:9) -->
                <div class="w-full aspect-video bg-slate-900 rounded-xl overflow-hidden flex flex-col items-center justify-center border-2 border-slate-200 relative shadow-inner">
                    <!-- Text & Icon giữ chỗ ban đầu -->
                    <div id="placeholder-text" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 z-0">
                        <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        <span class="font-medium text-sm md:text-base">Chưa kết nối Camera</span>
                    </div>
                    <!-- Thẻ img src để trống, sẽ được JS gán link khi bấm nút -->
                    <img id="video-stream" src="" class="w-full h-full object-contain relative z-10 hidden bg-black" />
                </div>
            </div>

            <!-- Cột Monitoring Log -->
            <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/50 p-5 border border-slate-100 flex flex-col h-[500px] lg:h-auto">
                <div class="flex justify-between items-center mb-5">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                        Detection Logs
                    </h2>
                    <span class="text-xs font-semibold text-slate-500 bg-slate-100 px-2 py-1 rounded-md">Real-time</span>
                </div>
                
                <!-- Khu vực chứa Log -->
                <div class="overflow-y-auto flex-1 pr-2 space-y-3" id="log-container">
                    <!-- Text báo đang chờ dữ liệu -->
                    <div class="text-center text-slate-400 text-sm mt-10" id="empty-log-text">
                        Đang chờ dữ liệu nhận diện...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Hàm kết nối camera
        function connectCamera() {
            const ip = document.getElementById('camera-ip').value.trim();
            const videoEl = document.getElementById('video-stream');
            const placeholderEl = document.getElementById('placeholder-text');
            const liveBadge = document.getElementById('live-badge');

            if (ip) {
                // Ẩn chữ giữ chỗ, hiện thẻ img & hiện chữ LIVE
                placeholderEl.classList.add('hidden');
                videoEl.classList.remove('hidden');
                liveBadge.classList.remove('hidden');
                liveBadge.classList.add('flex');
                
                // Trỏ src của ảnh về API backend kèm theo IP
                videoEl.src = `/video_feed?ip=${encodeURIComponent(ip)}`;
            } else {
                alert("Vui lòng nhập địa chỉ IP của ESP32!");
            }
        }

        // Cấu hình giao diện (Màu sắc + Icon) theo từng trạng thái nhận diện
        function getStatusConfig(status) {
            const s = (status || "").toLowerCase();
            
            // Có đeo khẩu trang (Đúng)
            if (s === "mask" || s.includes("dung") || s === "with_mask") {
                return {
                    bg: "bg-emerald-50 border-emerald-200",
                    text: "text-emerald-700",
                    icon: `<svg class="w-6 h-6 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`
                };
            }
            // Đeo sai cách
            if (s === "wrong mask" || s.includes("sai") || s === "incorrectly_worn_mask") {
                return {
                    bg: "bg-amber-50 border-amber-200",
                    text: "text-amber-700",
                    icon: `<svg class="w-6 h-6 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>`
                };
            }
            // Không đeo khẩu trang
            return {
                bg: "bg-rose-50 border-rose-200",
                text: "text-rose-700",
                icon: `<svg class="w-6 h-6 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`
            };
        }

        // Lấy log định kỳ
        setInterval(async () => {
            try {
                const response = await fetch('/api/logs');
                const logs = await response.json();
                const container = document.getElementById('log-container');
                
                // Nếu có log, xóa rỗng container để render lại
                if (logs && logs.length > 0) {
                    container.innerHTML = ''; 
                    
                    logs.forEach(log => {
                        const config = getStatusConfig(log.status);
                        const logEl = document.createElement('div');
                        
                        logEl.className = `p-3 rounded-xl border flex items-center gap-3 transition-all ${config.bg}`;
                        logEl.innerHTML = `
                            <div class="shrink-0 bg-white p-1.5 rounded-lg shadow-sm">
                                ${config.icon}
                            </div>
                            <div class="flex-1">
                                <div class="${config.text} font-bold capitalize text-sm md:text-base">${log.status}</div>
                                <div class="text-xs text-slate-500 font-mono mt-0.5">${log.time}</div>
                            </div>
                            <div class="px-2.5 py-1 rounded-md bg-white text-xs font-extrabold ${config.text} border ${config.bg} shadow-sm">
                                ${log.confidence}
                            </div>
                        `;
                        container.appendChild(logEl);
                    });
                }
            } catch (error) {
                console.error("Error fetching logs:", error);
            }
        }, 1000);
    </script>
</body>
</html>
